spring.application.name=tracker

# Database connection (credentials come from environment variables, never from this file)
spring.datasource.url=jdbc:mysql://localhost:3306/servicedesk_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate create/update the tables from our entities (fine for learning, not for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true